      - type: has_one
        target: JobMetadata
        via: $ref
      - type: has_one
        target: GitCommitCheck
        via: $ref
  - name: JobList
    api: Redocly Scout
    description: Paginated collection envelope.
    relationships:
      - type: has_many
        target: Job
        via: $ref
      - type: has_one
        target: Page
        via: $ref
  - name: PatchJob
    api: Redocly Scout
