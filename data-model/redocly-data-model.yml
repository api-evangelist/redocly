provider: Redocly
providerId: redocly
description: >-
  Redocly's published contracts describe one substantive entity graph — Scout,
  the API-discovery worker — plus a flat search result model. The Realm/Reunite
  platform objects an integrator would actually want (organization, project,
  branch, deployment, API description, scorecard, team, API key) are named
  throughout the docs but appear in NO published contract, so they cannot be
  modelled here without invention. They are listed under `undescribed` rather
  than guessed at.
entities:
