        target: GitNamespace
        via: field namespaceId
      - type: belongs_to
        target: GitRepository
        via: field repositoryId
      - type: belongs_to
        target: PullRequest
        via: field prId
      - type: belongs_to
        target: Job
        via: field parentJobId
