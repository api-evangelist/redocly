implicit_entities:
  note: >-
    Named only as path parameters or id fields inside Scout — never given a
    schema of their own in any published contract.
  entities: [Organization, Project, GitProvider, GitNamespace, GitRepository, Credential, User]
undescribed:
  note: >-
    Central to Redocly's product and documented in prose, but absent from
    every published contract. Not modelled here.
  entities:
    - Reunite project / branch / deployment
    - API description registry entry (the "apis" registry)
    - Scorecard and scorecard rule result
    - Team and role (RBAC)
    - API key and permission set
    - Subscription / seat / plan
    - Respect Monitoring run and alert
