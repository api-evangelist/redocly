  - name: Page
    api: Redocly Scout
    description: >-
      Cursor pagination envelope — endCursor, startCursor, hasNextPage,
      hasPrevPage, limit, totalItems. Cursors are declared opaque.
  - name: Metadata / MetadataValidationResult
    api: Redocly Scout
    description: >-
      Repository metadata submitted for validation via
      POST .../scout/metadata/validate, and the validation verdict returned.
  - name: Status
    api: Redocly Scout
    description: Worker status report posted by the Scout agent.
  - name: Problem
    api: Redocly Scout
