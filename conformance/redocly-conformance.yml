provider: Redocly
providerId: redocly
description: >-
  Redocly's market IS API specification tooling, so its domain standards are
  the specification standards themselves — and unusually, the conformance is
  visible in the contracts and discovery documents Redocly serves rather than
  only in marketing copy. Three separate agent-ecosystem schemas are declared
  by $schema or protocolVersion on live documents: the A2A agent card, the MCP
  server card, and the agentskills.io discovery schema.
conformance:
  - id: openapi-3.1
    conforms: true
    evidence:
      - >-
        All four published descriptions declare openapi: 3.1.0 —
        openapi/redocly-search-api-openapi.yaml,
        openapi/redocly-docs-mcp-openapi.yaml,
        openapi/redocly-scout-openapi.yaml,
        openapi/redocly-scout-agent-openapi.yaml.
  - id: rfc9457
    conforms: true
    evidence:
      - >-
        Every 4xx/5xx response in every published description uses
        application/problem+json with type/title/status/detail members. See
        errors/redocly-problem-types.yml.
      - >-
        Documented deviation: Scout states its `type` is unique only within
        that API and is not expected to dereference.
  - id: oauth2
    conforms: true
    evidence:
      - >-
        openapi/redocly-docs-mcp-openapi.yaml declares an OAuth2 securityScheme
        with an authorizationCode flow (authorizationUrl
        https://{projectHost}/_mcp/oauth2/auth, tokenUrl
        .../_mcp/oauth2/token-portal).
      - >-
        The scopes object is empty; authorization is decided by Redocly's RBAC
        engine, not by OAuth scopes. See scopes/redocly-scopes.yml.
  - id: oidc
    conforms: true
    evidence:
      - >-
        https://redocly.com/security lists Enterprise SSO over SAML 2 or
        OpenID Connect with domain verification and IdP team mapping.
      - >-
        No /.well-known/openid-configuration is served on redocly.com (404 on
        2026-08-27); OIDC is a customer-facing SSO capability, not a discovery
        surface on the marketing host.
  - id: pagination
    conforms: partial
    evidence:
      - >-
        Cursor pagination in Scout (after/before/endCursor/startCursor),
        page-number in Docs MCP listApis, offset in Search. Three styles across
        three contracts — see conventions/redocly-conventions.yml.
  - id: idempotency
    conforms: false
    evidence:
      - >-
        No Idempotency-Key header is declared in any published contract. The
        generated client can send one for customers' APIs; Redocly's own
        endpoints make no idempotency commitment.
  - id: rate-limit-headers
    conforms: false
    evidence:
      - No RateLimit-*, X-RateLimit-* or Retry-After header is declared in any published contract.
  - id: soc2-type-ii
    conforms: true
    evidence:
      - >-
        https://redocly.com/security — "Redocly has completed the System and
        Organization Controls (SOC) 2, Type II audit"; reports downloadable
        from the Reunite Compliance page.
  - id: csa-star
    conforms: true
    evidence:
      - >-
        https://redocly.com/security — CAIQ version 4 questionnaire completed
        and certified under the Cloud Security Alliance STAR program.
  - id: pci-dss
    conforms: not-applicable
    evidence:
      - >-
        https://redocly.com/security — Redocly does not store or process
        payment information; it relies on Stripe and Rebilly, both PCI DSS
        Level 1 service providers. Compliance is inherited, not held.
  - id: gdpr
    conforms: true
    evidence:
      - >-
        https://redocly.com/dpa — Data Processing Addendum offered to enable
        GDPR and CCPA compliance; sub-processor list published at
        https://redocly.com/sub-processors.
