description: >-
  Redocly versions its products with semantic versioning driven by changesets,
  publishes two dated changelogs (CLI and Realm platform) with an RSS feed, and
  backs the Cloud Products with a published SLA. What it does NOT publish is an
  API deprecation policy: no Sunset or Deprecation header contract, no
  documented removal window, and no operation in any published spec is marked
  deprecated.
versioning:
  scheme: semver
  mechanism: changesets
  current:
    - product: Redocly CLI
      version: 2.49.0
      released: '2026-08-27'
    - product: Realm / Revel / Reef / Redoc (platform)
      version: 0.136.2
      released: '2026-08-25'
    - product: Redoc (open source)
      version: 2.5.3
      released: '2026-05-29'
      note: A 3.0.0-rc.0 pre-release exists on Docker Hub (2025-10-24); latest still tracks 2.x.
  api_versioning:
    note: >-
      Redocly's own published contracts carry info.version only (Search 1.0.0,
      Docs MCP 1.0.0, Scout 1.0, Scout agent 1.0). No version is carried in a
      path, header or media type. Realm supports multi-version API descriptions
      as a product feature for customers.
