plan_count: 15
notes:
- 'Seat pricing (verified 2026-08-27): Pro $10 USD per seat/month; Enterprise $24 USD per seat/month;
  Enterprise+ custom, always billed yearly.'
- 'Realm upgrade add-on: +$18 (Pro) / +$42 (Enterprise) per seat/month on top of a single-product subscription.'
- 'Respect Monitoring commitment ladder (verified 2026-08-27): 20k=$100 with $5/1k overage; 50k=$200 with
  $4/1k; 200k=$600 with $3/1k; 500k=$1,000 with $2/1k. First 1,000 requests per month are free, then $10
  per 1k with no commitment.'
- MCP Servers and AI search are Enterprise-tier features; Pro does not include them. Enterprise also adds
  SSO, Guest SSO, RBAC, remote content, Typesense search, analytics, and raises the page allowance from
  100 to 500.
- A budget cap can be set on metered items to prevent over-spending.
- 30-day free trial on Pro and Enterprise; a startup discount is published at https://redocly.com/startup-discount.
