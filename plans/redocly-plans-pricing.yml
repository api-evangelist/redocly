specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Redocly
providerId: redocly
created: '2026-05-04'
modified: '2026-05-22'
tags:
  - API Catalog
  - API Documentation
  - Developer Portal
  - Governance
  - Linting
  - OpenAPI
  - MCP
  - Monitoring
description: >-
  Machine-readable plans and pricing for Redocly's Realm-family products plus
  the consumption-based Respect Monitoring add-on. Pricing reflects values
  published on https://redocly.com/pricing as of 2026-05-22. Per-seat pricing
  applies to subscription tiers; Respect Monitoring is metered per 1k requests.
plans:
  - id: redocly-pro
    name: Pro
    type: paid
    description: >-
      Per-seat subscription tier covering Reunite, Redoc, Revel, and Reef.
      Includes 1 project, 100 pages, and custom-domain hosting.
    entries:
      - label: Pro Seat (Monthly)
        description: Per-user monthly subscription billed monthly
        name: pro_seat_monthly
        type: subscription
        metric: seat
        limit: 1
        timeFrame: month
        geo: global
        domains: []
        unit: 1
        price: '10.00'
        currency: USD
        userMultiplied: true
      - label: Project Quota
        description: Number of projects included
        name: project_quota
        type: quota
        metric: projects
        limit: 1
        timeFrame: subscription
        geo: global
        domains: []
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Page Quota
        description: Total documentation pages included
        name: page_quota
        type: quota
        metric: pages
        limit: 100
        timeFrame: subscription
        geo: global
        domains: []
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Reunite
      - name: Redoc
      - name: Revel
      - name: Reef
      - name: Custom Domain Hosting
      - name: Redocly CLI
  - id: redocly-enterprise
