  responses:
    BadRequest:
      description: Bad Request.
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type:
                type: string
                description: Error type.
                example: about:blank
              title:
                type: string
                description: Error title.
                example: Unauthorized
              status:
                type: integer
                description: >-
                  HTTP status code generated by the origin server for this
                  occurrence of the problem.
                example: 401
              detail:
                type: string
                description: A human-readable message with more details.
                example: The request doesn't contain a GitHub signature
            required:
              - detail
    InternalServerError:
      description: Internal Server Error.
      content:
        application/problem+json:
          schema:
            type: object
            properties:
