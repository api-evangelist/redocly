source: https://redocly.com/pricing (plan quotas, verified 2026-08-27, HTTP 200), plus the four published
  OpenAPI descriptions in openapi/ and a docs search through the live Docs MCP server at https://redocly.com/mcp
  for any published HTTP rate limit.
limit_count: 9
header_evidence: No RateLimit-*, X-RateLimit-* or Retry-After header appears in any of the four published
  Redocly OpenAPI descriptions. The previous version of this file recorded Retry-After; that was not sourced
  from a Redocly contract or docs page and has been removed rather than carried forward.
response_code_evidence: No published Redocly contract declares 429, 402 or 503. The previous version of
  this file asserted 429/402/503; none is documented by Redocly, so they are now null. The only rate-limit-like
  behaviour that IS documented is the AWS API Gateway 403 {"message":"Missing Authentication Token"} that
  api.redocly.com returns to anonymous callers, which is authentication, not throttling.
budget_controls:
  documented: true
  note: A maximum budget can be set on metered items (Respect Monitoring) to prevent over-spending.
  source: https://redocly.com/pricing
gaps:
- No published per-key, per-account or per-endpoint HTTP rate limit for any Redocly API.
- No 429 response and no rate-limit response headers in any published contract.
- The Docs MCP server at https://redocly.com/mcp answered anonymous requests on 2026-08-27 with no rate-limit
  headers on the response.
