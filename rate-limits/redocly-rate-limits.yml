specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Redocly
providerId: redocly
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-22'
tags:
  - API Catalog
  - API Documentation
  - Arazzo
  - Developer Portal
  - Governance
  - Linting
  - Monitoring
  - OpenAPI
  - Quotas
  - Throttling
description: >-
  Machine-readable rate-limit and quota definitions for Redocly. Redocly's
  subscription products (Realm, Reunite, Revel, Reef, Redoc, Redocly CLI) are
  bounded by per-seat plan quotas (projects, pages) rather than per-minute API
  rate limits. The Respect Monitoring product exposes explicit usage tiers
  (1k/20k/500k requests per month) which are captured here as monthly quotas
  with associated overage behavior.
headers:
  limit: null
  remaining: null
  reset: null
  retryAfter: Retry-After
  policy: null
responseCodes:
  throttled: 429
  quotaExceeded: 402
  serviceUnavailable: 503
limits:
  - tier: pro
    name: Pro Plan Project Quota
    scope: workspace
    metric: projects
    limit: 1
    timeFrame: subscription
    applies:
      - Redocly Realm
      - Redocly Reunite
      - Redocly Revel
      - Redocly Reef
  - tier: pro
    name: Pro Plan Page Quota
    scope: workspace
    metric: pages
    limit: 100
    timeFrame: subscription
    applies:
      - Redocly Realm
      - Redocly Reunite
      - Redocly Revel
      - Redocly Reef
  - tier: enterprise
    name: Enterprise Plan Page Quota
    scope: workspace
    metric: pages
    limit: 500
    timeFrame: subscription
    applies:
      - Redocly Realm
      - Redocly Reunite
      - Redocly Revel
      - Redocly Reef
  - tier: enterprise-plus
    name: Enterprise+ Negotiated Capacity
    scope: contract
    metric: pages
    limit: -1
    timeFrame: subscription
    applies:
      - Redocly Realm
      - Redocly Reunite
      - Redocly Revel
      - Redocly Reef
  - tier: respect-free
    name: Respect Monitoring Free Tier
    scope: account
    metric: requests_per_month
    limit: 1000
    timeFrame: month
    applies:
      - Redocly Respect Monitoring
  - tier: respect-commit-20k
    name: Respect Monitoring 20k Commitment
    scope: account
    metric: requests_per_month
    limit: 20000
    timeFrame: month
    applies:
      - Redocly Respect Monitoring
  - tier: respect-commit-500k
    name: Respect Monitoring 500k Commitment
    scope: account
    metric: requests_per_month
    limit: 500000
    timeFrame: month
    applies:
      - Redocly Respect Monitoring
policies:
  - name: Subscription Quotas, Not Request Rates
    description: >-
      Realm-family products (Reunite, Redoc, Revel, Reef) bound usage by
      per-seat subscription quotas (projects, pages) rather than per-second or
      per-minute API rate limits. There is no public RateLimit-* header
      specification.
  - name: Respect Monitoring Metered Overage
    description: >-
      Respect Monitoring meters Arazzo workflow request volume per month.
      Overage past committed volume is billed per 1k requests at rates that
      decline with commitment size ($5/1k at 20k commit through $2/1k at 500k
      commit).
  - name: Fair Use on Enterprise+
    description: >-
      Even on negotiated Enterprise+ contracts, sustained usage that materially
      impacts shared infrastructure may be subject to fair-use throttling.
  - name: Backoff Strategy
    description: >-
      For any 429/503 responses on Redocly-hosted services, clients should
      implement exponential backoff with jitter and honor the Retry-After
      header when present.
maintainers:
