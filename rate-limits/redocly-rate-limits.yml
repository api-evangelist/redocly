description: Redocly publishes PLAN QUOTAS but no HTTP rate limits. Seats, projects, pages and Respect
  Monitoring requests are all bounded and priced; the request-rate behaviour of Redocly's own HTTP APIs
  is not documented anywhere. No published contract declares a 429 response, and none declares a RateLimit-*,
  X-RateLimit-* or Retry-After header — so an agent calling a Redocly API has no runtime signal to back
  off on. This is a notable gap for a vendor that publishes a governance guide on API rate limiting.
