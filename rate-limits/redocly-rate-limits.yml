policies:
- name: Subscription Quotas, Not Request Rates
  description: Realm-family products (Reunite, Redoc, Revel, Reef) bound usage by per-seat subscription
    quotas (projects, pages) rather than per-second or per-minute API rate limits. There is no public
    RateLimit-* header specification.
- name: Respect Monitoring Metered Overage
  description: Respect Monitoring meters Arazzo workflow request volume per month. Overage past committed
    volume is billed per 1k requests at rates that decline with commitment size ($5/1k at 20k commit through
    $2/1k at 500k commit).
- name: Fair Use on Enterprise+
  description: Even on negotiated Enterprise+ contracts, sustained usage that materially impacts shared
    infrastructure may be subject to fair-use throttling.
- name: Backoff Strategy
  description: For any 429/503 responses on Redocly-hosted services, clients should implement exponential
    backoff with jitter and honor the Retry-After header when present.
