unitEconomics:
  - name: Cost per Seat
    metric: subscription_cost / active_seats
    target: TBD
  - name: Cost per 1K Respect Requests
    metric: respect_billed_cost / (respect_requests / 1000)
    target: '<= $10 retail; $2-5 on commit tiers'
  - name: Cost per Active Consumer
    metric: billed_cost / active_consumers
    target: TBD
  - name: Pages Utilized vs Plan Quota
    metric: pages_used / plan_page_quota
    target: '< 1.0 to avoid forced tier upgrade'
