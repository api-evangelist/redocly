specification: FinOps Framework
specificationVersion: '1.0'
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Redocly
providerId: redocly
publisherName: Redocly
serviceCategory: API
created: '2026-05-04'
modified: '2026-05-22'
tags:
  - API Catalog
  - API Documentation
  - Arazzo
  - Developer Portal
  - Governance
  - Linting
  - Monitoring
  - OpenAPI
  - FinOps
  - Cost Management
  - FOCUS
description: >-
  FinOps framework definition for Redocly. Redocly bills on two cost surfaces:
  per-seat subscriptions for Realm-family products (Reunite, Redoc, Revel, Reef,
  CLI tooling) and metered, per-1k-request consumption for Respect Monitoring
  (Arazzo workflow executions). This document provides a FOCUS-aligned mapping
  for cost allocation, usage measurement, and unit-economics reporting across
  the seat-priced and metered surfaces.
principles:
  - name: Visibility
    description: Make API consumption costs visible to engineering, product, and finance teams in near
      real-time.
  - name: Allocation
    description: Tag every chargeable API call with the consuming team, environment, application, and
      feature so cost can be allocated.
  - name: Optimization
    description: Continuously evaluate request patterns, caching, batching, and tier selection to reduce
      cost per useful unit of work.
  - name: Accountability
    description: Establish budget owners and chargeback or showback flows for each consuming team.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
billingModel:
  pricingCategory: Hybrid (Subscription + Usage-Based)
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Subscription
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: Redocly
  ServiceCategory: Developer Tools / API
  ProviderName: Redocly
  PublisherName: Redocly
  InvoiceIssuerName: Redocly
  PricingCategory: Hybrid (Subscription + Usage-Based)
  PricingUnit: seat | 1k_requests
  BillingCurrency: USD
  ChargeCategory: Subscription / Usage
meters:
  - name: seats
    description: Active subscription seats by tier (Pro, Enterprise, Enterprise+)
    unit: seat
    aggregation: max
    dimensions:
      - tier
      - workspace
      - product
  - name: pages
    description: Documentation pages consumed against the plan page quota
    unit: page
    aggregation: max
    dimensions:
      - workspace
      - project
      - tier
  - name: respect_requests
    description: Arazzo workflow request count metered by Respect Monitoring
    unit: request
    aggregation: sum
    dimensions:
      - workspace
      - environment
      - workflow
      - commitment_tier
  - name: data_egress
    description: Bytes returned over the network in API responses, where billed
    unit: GB
    aggregation: sum
    dimensions:
      - api
      - region
      - consumer
