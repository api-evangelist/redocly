description: >-
  Redocly publishes a single security page rather than a hosted trust portal,
  and it names concrete certifications with concrete dates. The compliance
  ARTIFACTS themselves — SOC 2 Type II report, penetration test results — are
  gated behind a Reunite login on the Compliance page, so the claims are
  public and the evidence is customer-only.
certifications:
  - name: SOC 2 Type II
    status: completed
    evidence: >-
      "Redocly has completed the System and Organization Controls (SOC) 2,
      Type II audit. Log in to download this and other reports."
    report_access: https://redocly.com/docs/realm/reunite/organization/access-compliance-reports
    gated: true
  - name: CSA STAR / CAIQ v4
    status: certified
    evidence: >-
      "Completed the CAIQ version 4 questionnaire and certified under the
      Cloud Security Alliance's (CSA) STAR program for cybersecurity."
  - name: PCI DSS
    status: inherited
    evidence: >-
      Redocly does not store or process payment information; it relies on
      Stripe and Rebilly, both PCI DSS Level 1 service providers.
  - name: GDPR / CCPA
    status: addressed-by-dpa
    evidence: Data Processing Addendum published at https://redocly.com/dpa
practices:
  encryption:
    in_transit: TLS 1.2+
    at_rest: AES-256
  identity:
    sso: [SAML 2.0, OpenID Connect]
    domain_verification: true
    rbac: Project-level permissions for groups; IdP-attribute team mapping.
    audit_trail: Event logging of project updates over time.
