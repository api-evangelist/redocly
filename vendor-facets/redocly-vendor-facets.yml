earns_nothing:
- feature: x-mcp
  check: mcp_server
  layer: agent_readiness
  why: >-
    The extension documents an MCP server inside the OpenAPI; the dimension reads a deployed, probed server,
    not a description of one.
- feature: docs-mcp
  check: well_known_published
  why: >-
    Realm serves an MCP server card and agent-skills index, not an api-catalog, security.txt or protected-resource
    document (redocly.com returns 404 for /.well-known/api-catalog).
- feature: decorators
  check: examples_present
  why: Decorators can inject examples the provider supplies; the tool writes none of its own.
out_of_reach:
  checks:
  - well_known_catalog
  - sdk_count_1
  - sdk_count_3
  - cli_present
  - postman_present
  - change_log_present
  - status_page_present
  - contract_present
  note: >-
    Redocly lints and renders contracts the provider brings; it does not create one, serve an api-catalog,
    or generate the provider's SDKs, CLI or collection.
unscored_practice:
- feature: x-mcp
  why: An OpenAPI-native pointer from the contract to the provider's MCP servers; no check reads it.
- feature: webmcp
  why: In-browser tool registration; no check reads WebMCP.
- feature: cli-lint
  why: >-
    Arazzo linting, Respect contract testing and generate-arazzo are real contract practice with no scored
    signal.
