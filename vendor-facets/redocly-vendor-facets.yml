# Vendor facets — Redocly. Three products in one file: Redoc CE (the open-source OpenAPI
# renderer), Realm/Reunite (the hosted developer portal) and Redocly CLI (lint, bundle, decorators,
# Respect/Arazzo testing). Realm is the only docs platform here whose Agent Skills are written by
# the provider rather than generated, so its skills and agent card can earn full credit; the CLI's
# lint rules are the one route in this set into Contract Quality and Contract Governance, but only
# through fixes and rulesets the provider has to make and publish itself.
vendor: redocly
name: Redocly
website: https://redocly.com
areas:
- documentation
- developer-portal
registry_keys:
- redoc
- redocly
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: measured
summary: >-
  Redocly's lift has two halves. Realm, the hosted portal, ships llms.txt, a docs MCP server (graded `platform`),
  Replay try-it, a mock server, and it publishes Agent Skills the provider writes, with an A2A agent card
  generated over them, so those two earn full credit if the provider actually writes the skills. Redocly
  CLI is the only tool in this documentation set that reaches Contract Quality and Governance: its recommended
  ruleset flags missing summaries, operationIds, 2xx/4xx responses and empty servers, and a published
  ruleset earns rules_present. Neither half changes a score on its own; the provider has to fix what the
  linter flags, write the skills and publish the ruleset.
features:
- id: redoc-ce
  name: Redoc CE renderer
  description: >-
    Open-source three-panel reference renderer for OpenAPI 3.1/3.0/2.0 with request and response samples.
  source: https://redocly.com/docs/redoc
  tier: open-source
- id: realm-portal
  name: Realm hosted developer portal
  description: >-
    A hosted portal combining Markdown guides and OpenAPI reference docs, with RBAC, search and an AI
    assistant.
  source: https://redocly.com/docs/realm/ai-ready
  tier: unknown
- id: replay
  name: Replay try-it console
  description: >-
    A "Try it" client in the reference with environments, history and saved requests, pointed at live
    servers or the mock server.
  source: https://redocly.com/docs/end-user/test-apis-replay
  tier: unknown
- id: mock-server
  name: Built-in mock server
  description: >-
    Every API description in a project gets a mock server at /_mock/<description>/ returning sample responses.
  source: https://redocly.com/docs/realm/config/mock-server
  tier: unknown
- id: code-snippets
  name: Generated code snippets
  description: Code snippets in the OpenAPI reference are generated from the description.
  source: https://redocly.com/docs/realm/config/code-snippet
  tier: unknown
- id: llms-txt
  name: Generated llms.txt
  description: >-
    Realm creates an llms.txt listing each page with a clean Markdown copy, configurable through the seo.llmstxt
    options.
  source: https://redocly.com/docs/realm/config/seo
  tier: unknown
- id: docs-mcp
  name: Docs MCP server
  description: >-
    Realm generates an MCP server from the docs and OpenAPI descriptions, RBAC-scoped, with a submit-feedback
    tool and an MCP server card.
  source: https://redocly.com/docs/realm/customization/mcp-server
  tier: unknown
- id: agent-skills
  name: Provider-authored Agent Skills with discovery
  description: >-
    Skills the provider writes under @skills/ are published at /.well-known/agent-skills/ with an agentskills.io
    index and exposed as MCP resources.
  source: https://redocly.com/docs/realm/customization/agent-skills
  tier: unknown
- id: agent-card
  name: A2A agent card
  description: Realm hosts /.well-known/agent-card.json listing the published skills.
  source: https://redocly.com/docs/realm/customization/agent-skills
  tier: unknown
- id: webmcp
  name: WebMCP tools
  description: Experimental in-browser tools that let a reader's agent search, read and open pages.
  source: https://redocly.com/docs/realm/customization/webmcp
  tier: unknown
- id: cli-lint
  name: Redocly CLI lint with recommended ruleset
  description: >-
    Lints OpenAPI, AsyncAPI, Arazzo and Overlay; the recommended set errors on missing operation summaries,
    duplicate operationIds, empty servers and undefined security, and warns on missing operationIds, 2xx
    and 4xx responses and example.com servers.
  source: https://redocly.com/docs/cli/rules/recommended
  tier: open-source
- id: configurable-rules
  name: Custom rulesets and ruleset templates
  description: Configurable rules and plugin rules let a provider write and share its own ruleset.
  source: https://redocly.com/docs/cli/v1/rules/recommended
  tier: open-source
- id: decorators
  name: Decorators
  description: Bundle-time transforms that rewrite descriptions, remove endpoints or add elements such
    as examples.
  source: https://redocly.com/docs/cli/decorators
  tier: open-source
- id: x-mcp
  name: x-mcp OpenAPI extension
  description: Experimental root-level extension that documents a provider's MCP servers inside its OpenAPI.
  source: https://redocly.com/docs/realm/content/api-docs/openapi-extensions/x-mcp
  tier: unknown
