- aid: redocly:redocly-respect
  name: Redocly Respect Monitoring
  description: 'Respect Monitoring is Redocly''s continuous, API-aware monitoring product powered by OpenAPI
    Arazzo workflows. Rather than uptime checking, it validates that API responses conform to specifications
    — examining status codes, content types, headers, and schemas — and detects schema drift, missing
    status codes, and performance issues. Supports Slack and email alerts, multi-environment monitoring
    (staging, production, dev), and CI/CD integration with GitHub, GitLab, and Jenkins. Usage-based pricing:
    1,000 monthly requests free; commitment plans from $100/month (20k requests) to $1,000/month (500k
    requests).'
  humanURL: https://redocly.com/respect
  tags:
  - Arazzo
  - Monitoring
  - Observability
  - Testing
  properties:
  - type: Documentation
    url: https://redocly.com/docs/respect
  - type: Pricing
    url: https://redocly.com/pricing
- aid: redocly:redocly-arazzo
  name: Arazzo Specification (Redocly Tooling)
  description: Arazzo is the OpenAPI Initiative's specification for describing multi-step API workflows;
    Redocly is a primary tooling vendor with first-class Arazzo support across Redocly CLI (lint, validate,
    generate) and Respect Monitoring. Arazzo 1.1 (May 2026) adds AsyncAPI support, workflow composition,
    selectors, identity-based references, and clearer runtime behavior.
  humanURL: https://redocly.com/blog/arazzo-specification-1-1-release
  tags:
  - Arazzo
  - OpenAPI
  - Specification
  - Workflows
  properties:
  - type: Documentation
    url: https://redocly.com/docs/cli/commands/respect
- aid: redocly:redocly-search-api
  name: Redocly Realm Search API
  description: 'The Search API is the machine-readable query surface of any Realm project: POST /_search
    returns documentation and API-reference matches and POST /_search-facets returns facet aggregations.
    It is the REST twin of the `search` tool on the Docs MCP server. Authentication is session-cookie
    only — the API accepts no API key or bearer token — and public projects need none at all, which is
    why Redocly''s own project answers anonymously. Errors are RFC 9457 problem documents. The server
    block is templated on {projectUrl} because every Realm customer serves their own copy; the default
    is redocly.com, Redocly''s own deployment.'
  humanURL: https://redocly.com/docs/realm/customization/search-api/openapi
  baseURL: https://redocly.com
  tags:
  - API Documentation
  - Developer Portal
  - Search
  properties:
