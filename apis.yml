- aid: redocly:redocly-reef
  name: Redocly Reef
  description: Redocly Reef is the internal API platform — a service catalog and governance product that
    organizes, aids discovery, and monitors APIs throughout their lifecycle. Reef includes Catalog for
    organizing and searching APIs, Scorecard for running linting rules against APIs, API Scout for discovering
    hidden APIs, API functions, and developer onboarding with dynamic client registration.
