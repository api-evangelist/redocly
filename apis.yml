- aid: redocly:redocly-scout
  name: Redocly Scout API
  description: 'Scout is Redocly''s API-discovery service: it crawls connected Git remotes, tracks pull
    requests and runs jobs that find hidden, duplicate and undocumented APIs, then pushes what it finds
    into a Reunite project. The REST API is scoped /orgs/{orgId}/projects/{projectId}/ and covers remotes,
    jobs, todos, status reporting and metadata validation, with opaque-cursor pagination and RFC 9457
    errors. Authentication is a bearer API key issued from the Reunite organization, or the browser session
    cookie. The server block is templated on {host} because Scout is deployed per customer.'
  humanURL: https://redocly.com/docs/realm/scout
  baseURL: https://{host}/api
  tags:
  - API Catalog
  - Discovery
  - Governance
  properties:
  - type: OpenAPI
    url: openapi/redocly-scout-openapi.yaml
  - type: Overlay
    url: overlays/redocly-scout-overlay.yaml
  - type: Documentation
    url: https://redocly.com/docs/realm/scout
  - type: Authentication
    url: authentication/redocly-authentication.yml
  - type: DataModel
    url: data-model/redocly-data-model.yml
