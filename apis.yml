access: 3rd-Party
created: '2026-01-05'
modified: '2026-05-22'
position: Consumer
segments:
  - Documentation
specificationVersion: '0.19'
apis:
  - aid: redocly:redocly-realm
    name: Redocly Realm
    description: >-
      Redocly Realm is the comprehensive API lifecycle management platform that
      unifies Redoc, Revel, and Reef into a single integrated product. Realm
      includes API documentation, mock servers, linting, catalog, scorecard,
      API functions, Markdown/Markdoc/React docs, API Scout for discovering
      hidden or duplicate APIs, dynamic client registration, MCP Servers
      (Enterprise) with OAuth and Client ID Metadata Document (CIMD) support,
      AI search and Typesense search, and multi-version API support for the
      Docs MCP tools.
    humanURL: https://redocly.com/realm
    tags:
      - AI
      - API Catalog
      - Developer Portal
      - Documentation
      - MCP
    properties:
      - type: Documentation
        url: https://redocly.com/docs/realm
      - type: ChangeLog
        url: https://redocly.com/docs/realm/changelog

  - aid: redocly:redocly-reunite
    name: Redocly Reunite
    description: >-
      Redocly Reunite is the Git-connected collaboration and deployment surface
      for Realm. It prepares, deploys, and hosts documentation projects and
      mock servers and ships a content editor, pull requests and reviews,
      deployments, scorecards, feedback, Respect Monitoring integration, and
      compliance reports. Reunite provides Webview previews for uncommitted
      work, Branch Previews for committed work-in-progress, and automated
      GitOps production releases. Integrates with GitHub, GitLab, Bitbucket,
      and Azure DevOps.
    humanURL: https://redocly.com/reunite
    tags:
      - Collaboration
      - Deployment
      - Documentation
      - GitOps
    properties:
      - type: Documentation
        url: https://redocly.com/docs/realm
      - type: GitHubOrg
        url: https://github.com/Redocly/reunite-push-action

  - aid: redocly:redocly-revel
    name: Redocly Revel
    description: >-
      Redocly Revel is the external developer hub product. It renders Markdown,
      Markdoc, and React pages with multi-product and localization capabilities,
      enabling organizations to create polished developer-facing portals and
      onboarding experiences for external API consumers.
    humanURL: https://redocly.com/revel
    tags:
      - Developer Portal
      - Documentation
      - Localization
    properties:
      - type: Documentation
        url: https://redocly.com/docs/realm

  - aid: redocly:redocly-reef
    name: Redocly Reef
    description: >-
      Redocly Reef is the internal API platform — a service catalog and
      governance product that organizes, aids discovery, and monitors APIs
      throughout their lifecycle. Reef includes Catalog for organizing and
      searching APIs, Scorecard for running linting rules against APIs, API
      Scout for discovering hidden APIs, API functions, and developer
      onboarding with dynamic client registration.
    humanURL: https://redocly.com/reef
    tags:
      - API Catalog
      - Governance
      - Scorecard
    properties:
      - type: Documentation
        url: https://redocly.com/reef
      - type: Reference
        url: https://redocly.com/docs/realm/config/scorecard

  - aid: redocly:redocly-redoc
    name: Redocly Redoc
    description: >-
      Redoc is the open-source engine that renders API reference documentation
      from OpenAPI definitions with a three-panel layout known for clarity and
      usability. Supports OpenAPI 3.2, 3.1, 3.0 and OpenAPI 2.0 (legacy
      Swagger). Available as a CLI tool, HTML tag, React component, and Docker
      image with over 25,000 GitHub stars.
    humanURL: https://redocly.com/redoc
    tags:
      - Documentation
      - OpenAPI
      - Reference
    properties:
      - type: Documentation
        url: https://redocly.com/docs/redoc
      - type: Reference
        url: https://redocly.com/redoc
      - type: GitHubOrg
        url: https://github.com/Redocly/redoc

  - aid: redocly:redocly-cli
    name: Redocly CLI
    description: >-
      Redocly CLI is an open-source command-line tool for working with OpenAPI
      descriptions, developer portals, and other API lifecycle operations.
      Supports linting, validation, bundling, splitting, and decorating OpenAPI
      files. Supports OpenAPI 3.2, 3.1, 3.0 and OpenAPI 2.0, AsyncAPI 3.0 and
      2.6, and Arazzo 1.0 and 1.1. Provides built-in rulesets including spec,
      recommended, minimal, and recommended-strict, plus the preview-docs and
      build-docs commands for documentation workflows.
    humanURL: https://redocly.com/redocly-cli
    tags:
      - Arazzo
      - CLI
      - Governance
      - Linting
      - OpenAPI
    properties:
      - type: Documentation
        url: https://redocly.com/docs/cli
      - type: Reference
        url: https://redocly.com/docs/cli/commands/lint
      - type: ChangeLog
        url: https://redocly.com/docs/cli/changelog
      - type: GitHubOrg
        url: https://github.com/Redocly/redocly-cli
      - type: JSONSchema
        url: json-schema/redocly-config-schema.json
      - type: JSONSchema
        url: json-schema/redocly-lint-result-schema.json
      - type: JSONStructure
        url: json-structure/redocly-config-structure.json
      - type: JSONStructure
        url: json-structure/redocly-lint-result-structure.json
      - type: JSONLD
        url: json-ld/redocly-context.jsonld
      - type: Vocabulary
        url: vocabulary/redocly-vocabulary.yml

  - aid: redocly:redocly-respect
    name: Redocly Respect Monitoring
    description: >-
      Respect Monitoring is Redocly's continuous, API-aware monitoring product
      powered by OpenAPI Arazzo workflows. Rather than uptime checking, it
      validates that API responses conform to specifications — examining status
      codes, content types, headers, and schemas — and detects schema drift,
      missing status codes, and performance issues. Supports Slack and email
      alerts, multi-environment monitoring (staging, production, dev), and
      CI/CD integration with GitHub, GitLab, and Jenkins. Usage-based pricing:
      1,000 monthly requests free; commitment plans from $100/month (20k
      requests) to $1,000/month (500k requests).
    humanURL: https://redocly.com/respect
    tags:
      - Arazzo
      - Monitoring
      - Observability
      - Testing
    properties:
      - type: Documentation
        url: https://redocly.com/docs/respect
      - type: Pricing
        url: https://redocly.com/pricing

  - aid: redocly:redocly-arazzo
    name: Arazzo Specification (Redocly Tooling)
    description: >-
      Arazzo is the OpenAPI Initiative's specification for describing
      multi-step API workflows; Redocly is a primary tooling vendor with
      first-class Arazzo support across Redocly CLI (lint, validate, generate)
      and Respect Monitoring. Arazzo 1.1 (May 2026) adds AsyncAPI support,
      workflow composition, selectors, identity-based references, and clearer
      runtime behavior.
    humanURL: https://redocly.com/blog/arazzo-specification-1-1-release
    tags:
      - Arazzo
      - OpenAPI
      - Specification
      - Workflows
    properties:
      - type: Documentation
        url: https://redocly.com/docs/cli/commands/respect

