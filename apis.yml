    url: errors/redocly-problem-types.yml
- aid: redocly:redocly-scout-agent
  name: Redocly Scout Agent API
  description: 'The Scout agent is the self-hosted worker half of Scout, deployed inside the customer''s
    own infrastructure (Redocly documents an AWS ECS task definition). Its API is small and operational:
    a health check plus two webhook receivers that accept GitHub and GitLab events, authenticated by the
    x-hub-signature-256 and x-gitlab-token signature headers respectively. Errors are RFC 9457 problem
    documents and the 500 problem carries an `event` member naming the incoming webhook event.'
  humanURL: https://redocly.com/docs/realm/scout
  baseURL: http://{host}
  tags:
  - Discovery
  - Webhooks
  - Self-Hosted
