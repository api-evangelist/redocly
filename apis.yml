  - type: ErrorCatalog
    url: errors/redocly-problem-types.yml
- aid: redocly:redocly-docs-mcp
  name: Redocly Docs MCP Server
  description: 'The Docs MCP server is Realm''s Model Context Protocol endpoint, generated automatically
    from a project''s documentation and OpenAPI descriptions and served at /mcp on the project root. Redocly
    runs it on its own site: an anonymous tools/list against https://redocly.com/mcp returns two tools
    — a JavaScript sandbox `execute` and a `describe-tools` introspection call — behind which sit eleven
    sandbox functions including listApis, getEndpoints, getEndpointInfo, getSecuritySchemes, getFullApiDescription
    and search. Access is decided by the same RBAC engine that protects the portal; OAuth 2.0 authorization
    code is available per project, and the server validates a bearer token''s aud claim against the organization
    ID.'
  humanURL: https://redocly.com/docs/realm/customization/mcp-server
  baseURL: https://redocly.com/mcp
  tags:
  - Artificial Intelligence
  - API Documentation
  - MCP
