- aid: redocly:redocly-revel
  name: Redocly Revel
  description: Redocly Revel is the external developer hub product. It renders Markdown, Markdoc, and
    React pages with multi-product and localization capabilities, enabling organizations to create polished
    developer-facing portals and onboarding experiences for external API consumers.
  humanURL: https://redocly.com/revel
