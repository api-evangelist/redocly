- aid: redocly:redocly-redoc
  name: Redocly Redoc
  description: Redoc is the open-source engine that renders API reference documentation from OpenAPI definitions
    with a three-panel layout known for clarity and usability. Supports OpenAPI 3.2, 3.1, 3.0 and OpenAPI
    2.0 (legacy Swagger). Available as a CLI tool, HTML tag, React component, and Docker image with over
    25,000 GitHub stars.
  humanURL: https://redocly.com/redoc
  tags:
