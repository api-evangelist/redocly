aid: redocly
url: >-
  https://raw.githubusercontent.com/api-evangelist/redocly/refs/heads/main/apis.yml
name: Redocly
description: >-
  Redocly is a company that specializes in API documentation and governance
  tooling. Their platform helps organizations create, manage, and publish API
  documentation through Realm (the integrated lifecycle platform that unifies
  Redoc, Revel, and Reef), Reunite (Git-connected collaboration and deployment
  for docs/APIs), Revel (developer portal), Reef (internal API catalog and
  scorecard), and Redoc (open-source OpenAPI renderer). The Redocly CLI provides
  linting, bundling, splitting, decoration, and documentation generation for
  OpenAPI, AsyncAPI, and Arazzo specifications. Respect Monitoring adds
  continuous, Arazzo-powered API monitoring, and the Enterprise tier exposes
  MCP Servers and AI search for Realm portals — positioning Redocly's catalog
  as an AI substrate for agentic software.
tags:
  - AI
  - API Catalog
  - API Documentation
  - Arazzo
  - Developer Portal
  - Governance
  - Linting
  - MCP
  - Monitoring
  - OpenAPI
type: Index
