apis:
- aid: redocly:redocly-realm
  name: Redocly Realm
  description: Redocly Realm is the comprehensive API lifecycle management platform that unifies Redoc,
    Revel, and Reef into a single integrated product. Realm includes API documentation, mock servers,
    linting, catalog, scorecard, API functions, Markdown/Markdoc/React docs, API Scout for discovering
    hidden or duplicate APIs, dynamic client registration, MCP Servers (Enterprise) with OAuth and Client
    ID Metadata Document (CIMD) support, AI search and Typesense search, and multi-version API support
    for the Docs MCP tools.
  humanURL: https://redocly.com/realm
  tags:
  - Artificial Intelligence
  - API Catalog
