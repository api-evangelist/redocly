- aid: redocly:redocly-cli
  name: Redocly CLI
  description: Redocly CLI is an open-source command-line tool for working with OpenAPI descriptions,
    developer portals, and other API lifecycle operations. Supports linting, validation, bundling, splitting,
    and decorating OpenAPI files. Supports OpenAPI 3.2, 3.1, 3.0 and OpenAPI 2.0, AsyncAPI 3.0 and 2.6,
    and Arazzo 1.0 and 1.1. Provides built-in rulesets including spec, recommended, minimal, and recommended-strict,
    plus the preview-docs and build-docs commands for documentation workflows.
  humanURL: https://redocly.com/redocly-cli
