    url: https://redocly.com/docs/changelog/feed.xml
    format: rss
    items: 50
streams:
  - name: Redocly CLI
    url: https://redocly.com/docs/cli/changelog
    current_version: 2.49.0
    current_date: '2026-08-27'
    sections: [Major Changes, Minor Changes, Patch Changes]
    entries:
      - version: 2.49.0
        date: '2026-08-27'
        breaking: false
        additions:
          - Added the `no-illogical-composition-keywords` rule (warn in `recommended`, error in `recommended-strict`).
        fixes:
          - Fixed telemetry silently failing to send when npm was not available.
        note: >-
          Redocly flags that existing API descriptions may report new problems
          under the recommended ruleset — a behaviour change delivered in a
          minor release.
      - version: 2.48.0
        date: '2026-08-25'
        breaking: false
        additions:
          - >-
            Agent-friendly client generation for python, go, php and cli
            alongside the TypeScript client, each self-documenting with
            --docs and ejectable with eject-generator.
        fixes:
          - Fixed `bundle` not resolving $refs inside an AsyncAPI 3 Multi Format Schema Object.
          - Fixed `respect --har-output` recording an empty postData for every request.
      - version: 2.47.0
        date: '2026-08-21'
        breaking: false
        additions:
          - Added a Vendor Extensions metric to `stats` counting distinct x- extensions and their occurrences.
        fixes:
          - Fixed `stats` reporting a wrong parameter count for AsyncAPI descriptions.
      - version: 2.46.2
        date: '2026-08-19'
        breaking: false
        fixes:
          - Updated @redocly/openapi-core to v2.46.2.
      - version: 2.46.1
        date: '2026-08-11'
        breaking: false
        fixes:
          - Updated @redocly/ajv to ^8.18.3 and openapi-core/respect-core to v2.46.1.
      - version: 2.46.0
        date: '2026-08-07'
        breaking: false
        additions:
          - Added the `spec-ref-siblings` rule reporting properties placed next to a $ref.
        fixes:
          - Fixed the `struct` rule to report unexpected fields on AsyncAPI 3 messages and message traits.
          - Reduced CLI startup time on Node 22.8+ by reusing Node's on-disk compile cache.
          - Fixed remote $refs with query parameters in the URL not resolving.
      - version: 2.45.0
        date: '2026-08-06'
        breaking: false
        fixes:
          - Fixed `bundle` losing schema keywords such as title and properties.
