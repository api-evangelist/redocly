provider: Redocly
providerId: redocly
description: >-
  Redocly publishes two dated, machine-readable changelogs: a per-release
  Redocly CLI changelog in changesets format, and a Realm platform changelog
  with an RSS feed covering every package in the portal build. Release cadence
  is high — nine CLI releases in August 2026 alone, the most recent on the day
  this artifact was written.
scheme: semver
